# /etc/nsswitch.conf for vngrd.
#
# Under the tmpfs /etc this is a COPY from /usr/share/factory/etc, not a file on
# disk that can be edited. It is in the factory tree (rather than left to glibc's
# compiled-in default) because the default is `passwd: files` and nothing else:
# without this, getpwnam() never reaches nss-systemd and every systemd user
# lookup falls through to /etc/passwd, which is also generated and empty.
#
# `systemd` is the nss-systemd source, built as part of the systemd package
# (meson.build: subdir('src/nss-systemd')) and registered with glibc through
# nsswitch.conf -- NOT by dropping a libnss_systemd.so.2 into /usr/lib, which is
# the thing that silently does nothing. See packages/systemd/build.
#
# `files` stays FIRST and is not a fallback. glibc stops at the first source that
# returns a match, and a source that returns "not found" moves on while one that
# returns an error stops the lookup. files-first is what puts the on-disk
# override ahead of the database, which is the behaviour an admin editing
# /etc/passwd expects, and under the tmpfs /etc that file is regenerated from
# factory every boot so the override never survives anyway -- which is the point.
passwd:     files systemd
group:      files systemd
shadow:     files systemd
gshadow:    files systemd
sudoers:    files systemd
hosts:      files myhostname dns
networks:   files
protocols:  db
services:   db
ethers:     db
rpc:        files
netgroup:   files
publickey:  files
