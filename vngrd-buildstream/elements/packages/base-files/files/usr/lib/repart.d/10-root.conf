[Partition]
# Writable root, created by initrd repart on first boot; the image carries only
# ESP + /usr + verity. Taken from whatever space is left, so one image fits any
# medium. root=PARTLABEL=vngrd-root because the UUID does not exist until then.
Type=root
# ext4, not btrfs: this is the only writable, unsealed layer and must survive
# power loss with a replayable journal and a real fsck. (homed's fallocate
# preallocation is unaffected; homed is unused.)
#
# repart execs mkfs.ext4 from the initrd, so mke2fs must be seeded there. Nothing
# else from e2fsprogs is needed: 1.47 compiles mke2fs.conf into the binary, and
# the rest is a private static library. A local mke2fs.conf would also be a
# writable input to filesystem creation.
Format=ext4
Label=vngrd-root
SizeMinBytes=1G
GrowFileSystem=yes
# AddValidateFS (capitalisation is the key; unknown keys are not ignored):
# partition_add_validatefs() defaults to true for any non-swap, non-vfat format,
# so repart forks a copy child to mount and populate the fresh filesystem. With
# no CopyFiles=/MakeDirectory=/MakeSymlink= there is nothing to copy, but the
# mount still fails in the initrd and the unit exits 1 before the root exists.
# Disabling it costs nothing: systemd-fsck checks the root on the host instead.
AddValidateFS=no
Weight=100
# No Verity= (the Merkle root cannot exist before repart formats it) and no
# Compression= (there is no mount to apply it to).
# Policy: PolicyAuthorize over PCR 11 (the UKI's .pcrsig) plus PolicyPCR 7 (the
# firmware's Secure Boot policy). See systemd-repart.service.d/10-device.conf.
# Both must hold; a db/dbx update moves PCR 7 and requires a reseal.
#
# PCR 5 is absent and cannot be added: the firmware measures the GPT before
# repart creates the root, so a seal from the provisioning boot would name a
# table that no longer exists. Reserving the root in the GPT does not help
# either: Format=/Encrypt= do not apply to an existing partition. The GPT is
# bound by the NV digest instead.
#
# TPM2PCRs mirrors the command-line --tpm2-pcrs= so a drop-in cannot weaken it.
# Requires v259+; this tree builds v262. /dev/tpmrm0 must be in the initrd.
Encrypt=tpm2
TPM2PCRs=7
# EncryptedVolume= makes repart compute fixate-volume-key= at format time, when
# it holds the volume key. Fields are name:keyfile:options:extra. The name is
# part of HMAC(volume_key, "cryptsetup:<name>:<uuid>"), so it must equal the
# crypttab name (vngrd-root). tpm2-device=auto is spelled out because this
# generates a normal crypttab line, not a copy of ours. Honoured only with
# --generate-crypttab=, whose path is the initrd's /run: the crypttab cannot be
# written into the volume it describes.
EncryptedVolume=vngrd-root::tpm2-device=auto:fixate-volume-key
