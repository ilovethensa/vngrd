# /etc is populated by 10-vngrd-etc.conf, and the ONE rule for it -- only C
# and L lines may target /etc -- is stated there, with the reasoning. This file
# keeps the /etc/os-release symlink and the /var state, and nothing else that
# touches /etc.
#
# /etc/os-release is the documented exception to the no-L+ rule, and it is here
# rather than in 10-vngrd-etc.conf so that it is READ FIRST. The 00- prefix is
# load-bearing, not cosmetic: upstream's own tmpfiles.d also has lines for
# /etc/os-release, and tmpfiles applies the files in sorted order. Ours creates
# a symlink; a later `C /etc/os-release' from anywhere else then fails with
# EEXIST (fd_copy_regular opens O_WRONLY|O_CREAT|O_EXCL, src/shared/copy.c:852)
# and is skipped, so the symlink survives. Keep L+ rather than plain L anyway:
# on a fresh tmpfs the destination is empty and L is enough, but L+ is what
# makes the file correct if /etc ever stops being a tmpfs, and it costs nothing.
#
# The reason /etc/os-release needs a symlink at all: systemd's HaveFileSystemSizeCheck
# calls stat() on it, and if it is a regular file copied from the factory tree it
# is not a symlink into /usr, so a sysupdate that changes /usr can leave a
# /etc/os-release from the previous release pointing at nothing. The symlink
# cannot go stale, because its target is always the live /usr/lib/os-release.
L+ /etc/os-release - - - - /usr/lib/os-release

# Staging directory for update artifacts (see /usr/lib/sysupdate.d/*.transfer).
# Not versioned or protected: it holds whole-partition images that dm-verity and
# the signed UKI's usrhash= are what ultimately authenticate. Must exist before
# systemd-sysupdate runs, since it enumerates the source directory directly.
d /var/lib/vngrd/update 0700 root root -
