[Service]
# The socket-activated half of the pcrlock service. Its ExecStart is
# `systemd-pcrlock --location=770`, and that is the location every varlink
# MakePolicy/Lock call inherits (vl_method_make_policy() -> make_policy() reads
# arg_location_start/end, pcrlock.c:5626). vngrd's window is 850-sysinit for the
# reason given in systemd-pcrlock-make-policy.service.d/10-vngrd.conf: a policy
# refreshed through this path with upstream's 770- window would drop PCR 9 (its
# nvpcr-separator records go unmapped because 770-nvpcr-separator is skipped), so
# the policy would change shape without anyone changing any hardware.
#
# ExecStart= cleared first: the unit's own line comes from the systemd package and
# a drop-in appends rather than replaces.
ExecStart=
ExecStart=/usr/lib/systemd/systemd-pcrlock --components=/var/lib/pcrlock.d --components=/usr/lib/pcrlock.d --pcr=7,13,14 --location=850-sysinit
