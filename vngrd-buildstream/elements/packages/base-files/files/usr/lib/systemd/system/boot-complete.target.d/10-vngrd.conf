# Break the ordering cycle without letting PID 1 delete a job:
#   default.target Wants= boot-complete.target
#   boot-complete.target Requires= vngrd-boot-gate.service
#   vngrd-boot-gate.service After= default.target
# systemd adds an implicit "member Before= target" edge, closing the loop, then
# deletes the first non-anchor job -- sometimes the gate itself, silently skipping
# the consistency check.
#
# DefaultDependencies=no removes exactly that implicit edge; the target's own
# Requires=/After=sysinit and the gate's explicit Before= keep the real ordering.
# Conflicts/Before=shutdown.target are restated because dropping default
# dependencies drops them too.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
