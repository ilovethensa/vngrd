[Unit]
# Runs from initrd-usr-fs.target on every boot (the host enablement is removed
# in packages/base-files/build because --tpm2-public-key= is an initramfs path).
# The only machine-side definition is the root, which matches and is a no-op;
# the A/B slot partitions are foreign and repart must leave them alone.
#
# Do not add ConditionPathExists=!/dev/disk/by-partlabel/vngrd-root: it also
# suppresses the run that adopts and formats the partition, failing the crypt
# dependency. repart adopting an existing partition and formatting it only if
# empty is the intended gate; overwriting needs --wipe/--empty=force.
#
# A machine-side Type=usr definition would adopt the live slot by type UUID
# alone; resizing /usr would invalidate the Merkle root that usrhash= commits to.
# GrowFileSystem=yes on the root is therefore not re-evaluated after first boot.
#
# Provision only when Secure Boot is enforced, not merely present. With no PK,
# edk2 still extends PCR 7 with empty records plus a separator, producing a
# fixed non-zero value that attests to nothing; sealing to it would unseal on any
# boot, including a replaced UKI. Enrollment changes PCR 7 and would brick the
# root. sd-boot's autoenroll reboot is why this is false on the setup boot.
# By this point efivarfs is mounted and security.secure_boot is set.
ConditionSecurity=uefi-secureboot

[Service]
# Name the disk through the ESP: acquire_root_devno() cannot resolve "/" here
# (arg_root is /sysusr, a tmpfs), and /usr only resolves by the accident of
# dm-verity sitting in between. With --node= set, find_root() takes the arg_node
# branch and block_get_whole_disk() yields the parent disk. The /usr label is
# versioned for sysupdate and cannot be an anchor; the ESP label is fixed by
# mkosi.repart/00-esp.conf and sysupdate never repartitions it.
#
# The label is vngrd-esp, not EFI: udev does not disambiguate duplicate labels
# (udev-node.c:459-466, equal priority means last processed wins), so a second
# ESP with the standard label could silently become the provisioning target.
# Two vngrd images on one machine still collide; that is documented in README.
# A missing anchor fails loudly: "Failed to open file or determine backing
# device of /dev/disk/by-partlabel/vngrd-esp".
ExecStart=
# The PCR 11 PolicyAuthorize is in the ExecStart= at the end of this file. Do
# not add a banner here claiming otherwise.
#
# The seal does not unseal on a build with -Dtpm=false: ENABLE_TPM=0 makes
# tpm_log_tagged_event() a no-op, so PCR 11 stays at its reset value. The build
# uses -Dtpm=true and packages/systemd/build asserts the symbol.
#
# In effect:
#   --tpm2-pcrs=7 --tpm2-public-key=/.extra/tpm2-pcr-public-key.pem
#   --tpm2-public-key-pcrs=11 --tpm2-pcrlock=
# gives, in tpm2_calculate_sealing_policy() order (tpm2-util.c:4207-4261):
#   PolicyAuthorize{ policyFile = tpm2-pcr-public-key.pem, key = PCR_SIGNING_PUBKEY }
#   PolicyPCR{ pcrs = 7 }
# Both elements must hold. t9 reads the token back; t10 proves authorisation is
# actually applied.
#
# .pcrsig is restricted to enter-initrd because PolicyAuthorize releases for the
# PCR 11 value the signed entries name. systemd-pcrphase-initrd moves PCR 11
# through enter-initrd (where cryptsetup runs) to leave-initrd at switch-root; a
# default four-phase signature would release for both. scripts/ukify injects
# --phases=enter-initrd, mkosi.postoutput rejects any other shape, and the host
# phase units are removed by base-files/build. Do not widen it.
#
# PCR 7 stays because PolicyPCR bakes in the values read at provisioning
# (tpm2_pcr_read_missing_values(), repart.c:4638). PCRs 0/2/4/11/12 move per boot
# or update, so naming them would lock out our own root. A slot switch moves 4,
# 11 and 12; PCR 7 is pre-ExitBootServices and identical for every slot, which is
# why an A/B switch can share the root at all. PCR 5 is absent: the firmware
# measures the GPT before repart creates the root, so the seal would name a table
# that no longer exists; the GPT guard's NV digest covers it instead (10-root.conf).
#
# A db/dbx update or a Secure Boot key reset moves PCR 7 and the seal refuses
# until resealed. With the recovery passphrase enrolled that is a prompt;
# without it, a brick.
#
# PolicyAuthorize binds the volume to an image this authority signed, not merely
# to "some signed image". PolicySigned inside it is driven by the booted UKI's
# .pcrsig; PolicyAuthorize replaces the session digest with a ticket-derived
# value, so the PCR 11 value is not baked into the sealed blob and future UKIs
# can ship their own signature. The enrolled policy is created once.
#
# PCR 7 stops being slot-invariant when a key rotation leaves two certificates
# live in db: edk2 extends PCR 7 once per validating image with
# EV_EFI_VARIABLE_AUTHORITY (DxeImageVerificationLib.c:1041-1046,
# Measurement.c:264-274), de-duplicated per certificate (Measurement.c:158-181).
# Remove the old entry in the same window or reseal; run recovery first.
#
# repart has no --tpm2-signature= preflight, so a wrong key or PCR 11 signature
# list bricks the first boot (no passphrase yet). Four things prevent that:
#   1. The public-key path is absolute. If --tpm2-public-key-pcrs defaults and
#      the key is not found, repart downgrades to bare PolicyPCR{7} with only a
#      debug log (repart.c:4594-4603). Passing the option makes it a loud failure.
#   2. /.extra/tpm2-pcr-public-key.pem is where systemd-stub puts the .pcrpkey
#      cpio (stub.c:880-915). tpm2_load_pcr_public_key() has no /.extra fallback,
#      unlike tpm2_load_pcr_signature() (tpm2-util.c:8152-8156), hence the
#      absolute path. tmpfiles does not copy it: ENABLE_TPM tracks TPM1.0.
#   3. repart runs in the initrd, so /.extra is the initrd root; the drop-in must
#      be copied into the initrd (mk-initrd-root), not symlinked into /usr.
#   4. t9/t10 read the token and the policy back.
#
# Spell out --tpm2-public-key-pcrs=11: the default is only filled in when the
# option is absent (repart.c:8464-8467), and a policy against the wrong PCR is
# wrong. 11 is TPM2_PCR_KERNEL_BOOT, which the UKI payload and .pcrsig cover.
#
# --tpm2-pcrlock= (empty) disables discovery: the presence of the option sets
# auto_pcrlock=false (repart.c:8215-8221, 8453-8462); the empty value is the
# documented way to name no policy. It must stay empty: combining it with
# PolicyAuthorize makes repart shard the key (repart.c:4678-4690), and the
# pcrlock shard cannot be satisfied at provisioning. A missing file yields a
# zeroed policy and a failed define (tpm2-util.c:7100-7130, repart.c:4615-4619);
# pcrlock state is per-machine (SRK, NV) and does not exist at dd time; and it
# would substitute a frozen equality policy for the live PCR read. /usr/lib/pcrlock.d
# is shipped only for a possible host-side policy.
#
# mkdir first: a failure should be a partition failure with a message, not a
# silently absent crypttab that the fixate path reads as "nothing to check".
# repart's stderr normally goes to the volatile initrd journal; journal+console
# puts its own reason on the serial line.
StandardOutput=journal+console
StandardError=journal+console

ExecStartPre=/usr/bin/mkdir -p /run/vngrd
# --generate-crypttab= writes /run/vngrd/repart-crypttab. The file is rewritten
# every boot; fixate-volume-key= is added only when repart formats the volume,
# since only then does it hold the volume key. Check the option, never the file
# (provisioning.h). The path is in the initrd's /run because the crypttab cannot
# be seeded into the volume it describes; vngrd-provision copies the value into
# TPM NV before switch_root.
#
# --copy-source=/ is required: definitions come from verified /usr (arg_root is
# /sysusr because /sysusr/usr is a mount point), but generated files default to
# arg_copy_source=arg_root. path_join() does not strip a leading slash
# (path-util.c:648-652), so the crypttab would resolve to
# /sysusr/run/vngrd/repart-crypttab, fopen would fail (repart.c:9728-9730), and
# the boot would fail before any partition or TPM work. --generate-fstab= has
# the same bug (repart.c:9587).
#
# --empty=create formats an adopted partition only when it is still empty. The
# default refuses; force would destroy a provisioned root. --size= is mandatory
# with this option and 1G matches 10-root.conf. The root is not reserved in the
# shipped GPT: pre-creating it needs --empty=create and a global --size=, which
# then also applies to the ESP and /usr.
ExecStart=systemd-repart --dry-run=no --copy-source=/ --tpm2-pcrs=7 --tpm2-public-key=/.extra/tpm2-pcr-public-key.pem --tpm2-public-key-pcrs=11 --tpm2-pcrlock= --generate-crypttab=/run/vngrd/repart-crypttab /dev/disk/by-partlabel/vngrd-esp
