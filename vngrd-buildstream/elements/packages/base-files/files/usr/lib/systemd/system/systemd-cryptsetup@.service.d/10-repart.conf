[Unit]
# On the first boot the LUKS2 container does not exist when the cryptsetup unit
# is generated; it only starts once systemd-repart has created the partition.
# udev publishes the by-partlabel symlink as soon as the partition node exists,
# i.e. before repart has run luksFormat — so without this, cryptsetup can race
# the LUKS2 header being written. The same race exists for sysroot.mount, see
# sysroot.mount.d/10-repart.conf.
After=systemd-repart.service
