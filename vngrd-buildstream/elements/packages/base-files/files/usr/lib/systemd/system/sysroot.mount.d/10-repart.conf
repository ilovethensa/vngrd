[Unit]
# sysroot.mount is generated by the initrd's fstab-generator from
# root=PARTLABEL=vngrd-root. On the first boot that partition does not exist
# yet: systemd-repart creates it, udev publishes by-partlabel/vngrd-root as soon
# as the partition node appears, and *then* repart runs mkfs.btrfs. Without
# this ordering the mount can start against an unformatted filesystem, because
# both sysroot.mount and systemd-repart.service are Before=initrd-root-fs.target
# with no relation between them.
After=systemd-repart.service
