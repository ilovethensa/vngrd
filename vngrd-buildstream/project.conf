# vngrd BuildStream project
#
# The only prebuilt input is elements/seed.bst, produced by
# ../vngrd-rootfs/scripts/export-seed.sh; everything else is an element.
name: vngrd

min-version: 2.8

element-path: elements

# overlaps and unstaged-files are real bugs here because the elements are
# disjoint. unaliased-url is not fatal: integrity comes from each element's ref.
# alphabetical-sort is off: it would reorder systemd's enablement symlinks.
fatal-warnings:
  - overlaps
  - unstaged-files

variables:
  arch: x86-64
  triplet: x86_64-vngrd-linux-gnu

  # Every ELF in the image must carry this; verify.bst enforces it.
  dynamic-linker: /usr/lib/ld-linux-x86-64.so.2

  # BuildStream stages build-depends at /, so the tree is already merged-/usr.
  prefix: /usr
  libdir: /usr/lib
  bindir: /usr/bin
  # Must be explicit: the meson plugin passes --sbindir from here and the
  # project's meson-global passes another; with BuildStream's default, systemd
  # installed its split_bin symlinks into /usr/sbin, which verify.bst rejects.
  sbindir: /usr/bin

  # Flags are variables so an element can extend the same string and so the
  # merged-/usr interpreter has one definition.
  #
  # Tarball helpers carry #!/bin/sh, which execve takes literally; this tree has
  # no /bin, so they fail with "bad interpreter". Rewrite rather than provide
  # /bin/sh, so a package installing into /bin still fails.
  shebang-fix: |
    find . -type f -size -10485760c -exec grep -l -m1 -E '^#!/bin/' {} + |
    while IFS= read -r f; do
      sed -i '1s|^#!/bin/|#!/usr/bin/|' "$f"
    done || true

  cflags: -O2 -pipe -march=x86-64 -I/usr/include
  cxxflags: -O2 -pipe -march=x86-64 -I/usr/include
  cppflags: -I/usr/include
  ldflags: -Wl,-O1 -Wl,--as-needed -fuse-ld=lld -L/usr/lib -Wl,--dynamic-linker=/usr/lib/ld-linux-x86-64.so.2

  # rustc ignores LDFLAGS. clang must remain the linker driver so it finds
  # libgcc_s in the seed's gcc dir; vngrd's libs come first, then the seed's
  # multiarch. No rpath: the sandbox root is the image tree. Used only by fish.
  rustflags: -C linker=clang -C link-arg=-fuse-ld=lld -C link-arg=-L/usr/lib -C link-arg=-L/usr/lib/x86_64-linux-gnu -C link-arg=-Wl,--dynamic-linker=/usr/lib/ld-linux-x86-64.so.2

environment:
  LC_ALL: C
  TZ: UTC

  # Name the compiler: zlib-ng infers -fPIC support from the name and a bare
  # `cc` matches neither gcc nor clang.
  CC: clang
  CXX: clang++
  CPP: clang -E
  AR: llvm-ar
  AS: llvm-mc
  NM: llvm-nm
  RANLIB: llvm-ranlib
  LD: ld.lld
  STRIP: llvm-strip
  OBJCOPY: llvm-objcopy
  # No OBJDUMP: Debian's llvm-objdump links curl/xml2, which the seed omits.
  READELF: llvm-readelf

  # LDFLAGS must be in the environment: configure compiles and runs conftest
  # before any make variable exists, and lld's default /lib64 interpreter would
  # make it look like a cross build.
  CFLAGS: "%{cflags}"
  CXXFLAGS: "%{cxxflags}"
  CPPFLAGS: "%{cppflags}"
  LDFLAGS: "%{ldflags}"

  # autoconf forces SHELL=${CONFIG_SHELL-/bin/sh} when running config.sub.
  CONFIG_SHELL: /usr/bin/sh

  # GNU make ignores SHELL from the environment and defaults to /bin/sh. When
  # the shell is missing it reports "(ignored)" and skips the recipe line, so
  # the autotools make-args below also pass SHELL on the command line.
  SHELL: /usr/bin/sh

  # Do NOT put MAKEOVERRIDES here: it would drop every command-line assignment
  # in sub-makes and break libcap's CC. It is scoped to cmake below.
  KBUILD_BUILD_USER: vngrd
  KBUILD_BUILD_GROUP: vngrd

elements:
  autotools:
    variables:
      # Tarball configure scripts carry #!/bin/sh; run them through sh. Override
      # `configure`, not `conf-cmd`, so the plugin's -x probe still works.
      configure: |
        sh %{conf-root}/configure %{conf-args}
        %{shebang-fix}

      # make ignores SHELL from the environment; command-line only.
      make-args: >-
        SHELL=/usr/bin/sh

      # Nothing else: configure bakes CFLAGS into the Makefile, where a package
      # may append. A command-line CFLAGS is immutable and would drop zlib-ng's
      # += -DZLIB_COMPAT.
      conf-global: >-
        --prefix=/usr
        --libdir=/usr/lib
        --sbindir=/usr/bin
        --disable-static
        --disable-dependency-tracking
        --disable-silent-rules

  meson:
    variables:
      meson: meson setup %{conf-root} %{build-dir} %{meson-args} %{setup-extra}
      meson-global: >-
        --prefix=/usr
        --libdir=/usr/lib
        --sbindir=/usr/bin
        --buildtype=plain
        --wrap-mode=nodownload
      # -fuse-ld belongs in link args only. -B/usr/lib is the startfile dir.
      # The semicolons are escaped because this expands into a shell script; the
      # value is one shell-quoted word containing meson's own array syntax.
      setup-extra: >-
        -Dc_args=-B/usr/lib
        '-Dc_link_args=["-B/usr/lib", "-L/usr/lib", "-fuse-ld=lld", "-Wl,--dynamic-linker=/usr/lib/ld-linux-x86-64.so.2"]'

  cmake:
    environment:
      # cmake bakes SHELL=/bin/sh and strips MAKEFLAGS, but MAKEOVERRIDES
      # survives and re-exports SHELL to try_compile and sub-makes. Scope it to
      # cmake: globally it would drop command-line CC and break libcap.
      MAKEOVERRIDES: SHELL=/usr/bin/sh
    variables:
      # Absolute install dirs (relative ones resolve under /usr). Flags quoted;
      # the linker flags are a space-separated string, not a ;-list.
      cmake-global: >-
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/usr
        -DCMAKE_INSTALL_LIBDIR=/usr/lib
        -DCMAKE_INSTALL_SBINDIR=/usr/bin
        -DCMAKE_C_FLAGS="%{cflags}"
        -DCMAKE_CXX_FLAGS="%{cxxflags}"
        -DCMAKE_EXE_LINKER_FLAGS="%{ldflags}"
        -DCMAKE_SHARED_LINKER_FLAGS="%{ldflags}"
      # Not Ninja: it hardcodes /bin/sh with no knob. Unix Makefiles is what
      # MAKEOVERRIDES was measured against.
      generator: Unix Makefiles
      # -S/-B, not the pre-3.13 -H form.
      cmake: >-
        cmake -S "%{conf-root}" -B%{build-dir} -G"%{generator}" %{cmake-args}
      # Direct make: `cmake --build` forwards no make arguments and cmake strips
      # MAKEFLAGS. Command-line SHELL is the only thing that reaches level-0
      # make, whose baked /bin/sh is otherwise fatal for quoted lines.
      make: make -C %{build-dir} SHELL=/usr/bin/sh ${JOBS}
      make-install: env DESTDIR="%{install-root}" make -C %{build-dir} SHELL=/usr/bin/sh install

  make:
    variables:
      # make-local is this project's hook for per-element additions, like
      # conf-local. Flags ride in make-args because the make kind accepts no
      # other variable, and they are quoted because make-args expands into sh.
      make-local: ""
      make: |
        %{shebang-fix}
        make %{make-args}
      # No LD=: a command-line LD would override libcap's LD := $(CC) -shared
      # and hand link flags to ld.lld. No CFLAGS=/LDFLAGS= either: command-line
      # values silence Makefile `+=`, which libcap needs for -fPIC.
      make-args: >-
        prefix=/usr
        libdir=/usr/lib
        bindir=/usr/bin
        sbindir=/usr/bin
        SHELL=/usr/bin/sh
        CC=clang
        CXX=clang++
        AR=llvm-ar
        STRIP=llvm-strip
        %{make-local}

# Split rules stay at BuildStream defaults. A split-rules domain is a list of
# glob patterns; an element-style exclude: mapping fails at first use.

# BuildStream 2.8 loads optional kinds through declared plugin origins.
# buildstream-plugins 2.8.1 was not released when this was written; pin it
# once available.
plugins:
- origin: pip
  package-name: buildstream-plugins
  elements:
  - autotools
  - cmake
  - make
  - meson

(@):
- elements/mirrors.yml
