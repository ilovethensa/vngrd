[Distribution]
Distribution=custom
Architecture=x86-64

[Output]
Format=disk
ImageId=vngrd
# Single source of truth for the image version. mkosi stamps IMAGE_VERSION= into
# usr/lib/os-release before the output stage, which is what the repart
# definitions expand %A from (GPT labels) and what systemd-sysupdate's
# ProtectVersion=%A compares against on the device. mkosi.finalize keeps
# VERSION_ID and PRETTY_NAME in step with it.
ImageVersion=0.1
OutputDirectory=../output/image
CompressOutput=no
# NOT a checksum manifest. ManifestFormat= selects the *package* manifest
# (<output>.manifest): a list of what went into the image, with no hashes in it
# and no signature. It is orthogonal to SHA256SUMS, which is written by
# mkosi.postoutput and does cover hashes. Do not read "ManifestFormat=json" as
# meaning the image's artifacts are attested by anything.
ManifestFormat=json
OutputMode=0644
# A/B update payloads, in addition to the installer image. Note this *replaces*
# the default set (uki, kernel, initrd) rather than extending it, so those have
# to be listed explicitly.
#   partitions -> one whole-partition image per split partition, named by
#                 SplitName= in mkosi.repart/. systemd-sysupdate installs these
#                 into the spare slot, and the filename carries the target
#                 partition's UUID so sysupdate can fixate it.
#   roothash   -> the verity root hash, for offline verification/signing.
#   repart-definitions -> a copy of the definitions this image was built from.
# uki -> the signed UKI, which is the update's third resource: it carries the new
# usrhash=, and slot selection is "boot the entry whose hash matches the content
# I want" rather than a boot loader switch.
SplitArtifacts=uki,kernel,initrd,partitions,roothash,repart-definitions

[Content]
Bootable=yes
Bootloader=systemd-boot
# NB: in current mkosi, yes/true parses UnifiedKernelImages= as *signed*, which
# means "consume a distro-prebuilt signed UKI (vmlinuz*.efi)" — gen_kernel_images()
# then ignores plain bzImages and the build dies with "no kernel was found".
# We build the UKI ourselves via ukify from /usr/lib/modules/<kver>/vmlinuz:
UnifiedKernelImages=unsigned
# Image layout: ESP, slot A (/usr + verity), and the two empty partitions of
# slot B. The writable root is created on first boot by systemd-repart, which
# reads /usr/lib/repart.d/10-root.conf out of the verified /usr after
# initrd-usr-fs.target and before initrd-root-fs.target. The slot B partitions
# ship empty (see mkosi.repart/13-usr-b.conf for why they cannot be created
# there) and are filled by systemd-sysupdate on the first update.
#
# root= names the *mapper*, not the partition: the root is a LUKS2 container
# whose key is sealed to the TPM2, and the fstab-generator uses root= verbatim
# (it does not follow a LUKS wrapper). /etc/crypttab (shipped, see base-files)
# turns by-partlabel/vngrd-root into /dev/mapper/vngrd-root, and the mount waits
# for it through the device dependency, so a PARTLABEL= here would try to mount
# the raw LUKS volume. A UUID cannot be used either: it does not exist until the
# first boot. Note the root is *shared* by both slots: it is the writable layer,
# not part of the update.
#
# usrhash= is injected by mkosi for the mkosi.repart/11-usr-verity.conf pair and
# must not be replaced by mount.usr=dissect, which only exists in initrd
# systemd >= 258 (ours is 257.5 and would pass "dissect" through verbatim as
# What=dissect, suppressing the usrhash= verity fallback). It is also the only
# thing that selects a slot: the initrd derives both verity partition paths from
# the hash, so an entry built for another version cannot mount this one, and vice
# versa. Keep it bare -- the two generators disagree about the rd. prefix, and
# rd.usrhash= sets up the verity device without ever creating the mount.
# fstab=0: neither the initrd's nor the host's systemd-fstab-generator may read
# /etc/fstab.
#
# Both read it from the root they are mounting, and the root is the writable
# LUKS2+btrfs volume — encrypted, but not verity-protected, because verity only
# covers /usr. So an fstab line there is an input the root's own contents decide.
# In the initrd that is worse than "wrong": the generator honours x-initrd.mount,
# and honouring it is documented as equivalent to being ordered before
# initrd-root-fs.target, i.e. privileged. A line mounting anything over
# /sysroot/usr/lib/systemd/system would be code execution inside the initrd, with
# /usr still verifying cleanly behind it. Demonstrated with the shipped
# generator: such a line yields a sysroot-usr-lib-systemd-system.mount plus a
# corresponding initrd-fs.target.requires/ link.
#
# Nothing is lost. The root is named by root= (a mapper, verbatim), /usr is set up
# from usrhash= alone, the LUKS2 volume is opened from the crypttab *inside the
# initrd*, and the initrd's systemd-repart run does not consult fstab at all.
#
# Note this does not turn the host's fstab off "just for safety" — the host
# reading it is a separate question with the same answer, which is why this is
# fstab=0 and not rd.fstab=0 (initrd only): a post-unlock attacker who can
# rewrite /etc/fstab would be handing the *next* boot's initrd the same lever, and
# rd.fstab=0 would leave that one intact.
# lockdown=integrity, like usrhash= above, is only meaningful because this
# command line is inside the Secure-Boot-signed UKI. The kernel is the one thing
# nothing else authenticates -- the signature covers the PE container, and the
# kernel is one of its sections -- so the whole argument that the running system
# is the one that was signed stops at "someone with root could load a different
# kernel next boot" unless the kernel is locked down. The attacker this is for
# is not remote; it is anything that reaches a shell on the writable layer
# (/etc, /var, /home are ordinary read-write btrfs, unlike the verity'd /usr)
# and can then rewrite a unit that runs before the login prompt.
#
# What it costs, checked against the shipped package set. The only thing worth
# knowing about the list is where it stops: reasons are an enum in
# include/linux/security.h:127-159 (strings in security/security.c:43-75), and
# lockdown_is_locked_down() refuses only when kernel_locked_down >= what
# (security/lockdown/lockdown.c:65). LOCKDOWN_INTEGRITY_MAX is 21, so
# =integrity reaches every reason up to and including 21 and nothing above it.
# Two of the reasons this image actually cares about are ABOVE that line, and
# that is the whole discussion below.
#
# Reached by =integrity (enum <= 21):
#   - unsigned kexec, LOCKDOWN_KEXEC (4): no reason to be here, because there is
#     nothing to stop. CONFIG_KEXEC=n and CONFIG_KEXEC_FILE=n, so /proc/kexec
#     does not exist as a node and the legacy path that performs no signature
#     check was closed by the config, not by lockdown. The kernel also has no
#     module loader (CONFIG_MODULES=n), so LOCKDOWN_MODULE_SIGNATURE (1) has
#     nothing to police.
#   - /dev/mem, kmem and port, LOCKDOWN_DEV_MEM (2): refused, but
#     CONFIG_DEVMEM=n has already removed /dev/mem, so the reason buys nothing
#     extra. The two are independent and both are in place.
#   - raw MSR (8), raw io port (7), direct PCI config (6), ACPI table
#     modification (9), device tree contents (10), debugfs (15), ioctl on serial
#     ports (12): refused. Nothing here uses any of them. Firmware loading is the
#     one to remember if a display or network driver that needs a blob is ever
#     added -- lockdown refuses to load it, and the failure looks like a missing
#     driver rather than a policy.
#   - /dev/efi_test, LOCKDOWN_EFI_TEST (3): the only EFI-adjacent reason, and it
#     is a test driver.
#
# NOT reached by =integrity (enum > 21) -- see the =confidentiality note below:
#   - /proc/kcore, LOCKDOWN_KCORE (22). One step above the floor. This is the one
#     real gap, and it is why kernel.config sets CONFIG_PROC_KCORE to n rather
#     than leaving the symbol on and trusting the command line. On x86
#     kc_xlate_dev_mem_ptr() is __va(phys) (fs/proc/kcore.c:51-56), so /proc/kcore
#     is the same arbitrary-physical-memory read primitive as /dev/mem through a
#     different inode, and it covers the whole direct map: the dm-crypt LUKS2
#     volume key, TPM2/TSS state, the btrfs keyring, and the decrypted page-cache
#     images of the verity'd /usr. It is 0400 root, so this is squarely the
#     threat model two paragraphs up -- a shell on the writable layer -- and
#     dm-verity stops nothing here, because what is being read out is the
#     *decrypted* content.
#   - perf_event_open(2), LOCKDOWN_PERF (26). Not refused wholesale, and worth
#     being exact about: kernel/events/core.c:13948-13952 is the only call site in
#     the kernel, and it fires only when PERF_SAMPLE_REGS_INTR is requested.
#     Nothing here uses perf.
#   - bpf(2): there is no bpf(2) to reach. CONFIG_BPF_SYSCALL is not set;
#     CONFIG_BPF=y exists only for kernel-internal tracing.
#
# NOTE: lockdown does not restrict EFI variable writes on this kernel. There is
# no security_locked_down() call in the efivarfs write path, and LOCKDOWN_EFI_TEST
# only covers /dev/efi_test. The README still forbids `bootctl set-default` and
# `bootctl update` as an A/B footgun, and bootctl set-default needs a glob on
# systemd 257.5 anyway.
#
# lockdown=integrity rather than =confidentiality: confidentiality also closes
# tracefs, which a developer image wants, and the extra restrictions it adds are
# not needed here. The command line can raise the level above the configured
# floor and the early param wins, which is what t3-lockdown asserts.
#
# The initrd carries no /usr, so nothing runs before the verity mount that could
# observe the lockdown transition.
KernelCommandLine=root=/dev/mapper/vngrd-root rw fstab=0 systemd.verity=yes lockdown=integrity console=tty0 console=ttyS0,115200
#
# Unit output that has to reach the serial console is routed per unit with
# StandardOutput=journal+console (see systemd-repart.service.d/10-device.conf),
# not with a global systemd.log_target=console.

# Two producer repos publish side-by-side; we read both directly (no tarball import).
#   ../output/rootfs  <- vngrd-rootfs/scripts/publish.sh
#   ../output/kernel  <- vngrd-kernel/scripts/build.sh
# BaseTrees populates the root early (extra trees are layered too late for
# Distribution=custom); mkosi.initrd.conf does the same for the initrd.
BaseTrees=../output/rootfs ../output/kernel
CleanPackageMetadata=no
# Initrd: mkosi/ukify auto initrd (MakeInitrd adds /etc/initrd-release + /init -> systemd;
# KernelModulesInitrd appends kmods).
MakeInitrd=yes
# No kmods: the kernel is CONFIG_MODULES=n, so there is no module loader and
# there is nothing to append. Left on it would be a no-op today and a silent
# behaviour change if a module were ever added to the kernel tree.
KernelModulesInitrd=no

[Validation]
# Signed UKI (kernel + initrd + cmdline in one PE binary) so the firmware
# validates the whole boot payload. This is what makes the verity /usr tree
# trustworthy: usrhash= lives in the signed cmdline, so the root hash is
# authenticated by the Secure Boot signature instead of being self-attested by
# the same unsigned UKI an attacker would replace. Keys live outside the repo;
# their paths come from mkosi.conf.d/50-local-keys.conf (gitignored) —
# scripts/check-inputs.sh refuses to build without them.
SecureBoot=yes
# Production images do NOT carry enrolment keys on the ESP. In setup mode
# anything that can write the ESP can enrol its own PK, which would replace the
# root of trust before the operator ever sees the machine. Enrolment is an
# explicit offline step using the signed PK/KEK/db updates that build.sh
# publishes under secureboot/ (see README.md, "Secure Boot key lifecycle").
#
# Tests and developer VMs do not use this path: run-vm.sh pre-enrols a fresh
# OVMF variable store host-side. A disposable VM that should enrol itself can
# be built with `mkosi --profile autoenroll`, which flips this setting back on;
# that profile is never used for a production artifact.
SecureBootAutoEnroll=no
# systemd-sbsign over sbsign: keeps the Authenticode signature inside the
# systemd-sbsign format, which is what systemd-stub and the TPM2 PCR signing
# path expect.
SecureBootSignTool=systemd-sbsign
# We ship a verity *hash* partition and no signature partition (the
# usr-verity-sig definition is gone). hash is the documented value for exactly
# that: repart creates the hash partition, no signature partition, and mkosi
# stops requiring the verity key -- so /var/lib/mkosi/keys/verity.* and the
# VerityKey=/VerityCertificate= settings in mkosi.conf.d/50-local-keys.conf are
# no longer needed.
#
# The root hash is authenticated by usrhash= inside the *signed* UKI command
# line, which is the stronger of the two mechanisms anyway: it is covered by the
# Secure Boot signature, whereas a verity signature partition is verified by
# systemd-veritysetup against whatever CA the initrd happens to trust. The
# signature partition was never read on the boot path (no
# systemd.verity_usr_options=root-hash-signature= in the command line) and would
# have been a third source of truth able to drift from the other two.
#
# The trust direction is the point, and it is one-directional: the initrd never
# looks a partition up by PARTUUID and then asks what hash it should have.
# determine_device() in systemd-veritysetup-generator.c:255-279 memcpy's the
# *first* 16 bytes of the hash into the data partition's sd_id128_t and the *last*
# 16 into the verity partition's, and builds /dev/disk/by-partuuid from those.
# hash -> PARTUUID, never PARTUUID -> hash. So there is no code path on which a
# tampered partition can dictate the hash it is then checked against, which is
# exactly the attack a signature partition exists to stop and a signed UKI already
# stops.
#
# It also confirms what repart's comments in 10-usr.conf and 11-usr-verity.conf
# claim about the two UUIDs. Checked against the shipped image, roothash
# 17d06f614cb03a87af0aca26ab106f913da44e5d13974a0b38f2831b8b00837d:
#   sfdisk -d  vngrd_0.1.raw2  17D06F61-4CB0-3A87-AF0A-CA26AB106F91  vngrd-usr_0.1
#   sfdisk -d  vngrd_0.1.raw3  3DA44E5D-1397-4A0B-38F2-831B8B00837D  vngrd-usr_0.1_verity
# First 128 bits, then last 128. mkosi.postoutput now asserts this from the
# roothash file rather than trusting it, because the UKI's usrhash= and these two
# partitions come from different repart runs.
#
# What the verity *superblock* UUID is, is not this: repart derives it from the
# seed (repart.c:6241, derive_uuid(context->seed, "verity-uuid", ...)), so it is
# reproducible and identical across builds and says nothing about the root hash.
# It is not the partition UUID and it is not the root hash, and checking it would
# prove nothing.
Verity=hash

# This is what makes the LUKS2 root's seal name an *image* rather than a
# signing authority. With only SecureBoot=yes above, the TPM2 token repart
# writes is a bare PolicyPCR{7}; PCR 7 is derived from the firmware's Secure
# Boot variables, so it is byte-identical on every machine built by the same
# authority, and ANY legitimately signed vngrd image of ANY version and ANY A/B
# slot unseals any other machine's root. Signing PCR 11 changes the policy to
#
#     PolicyAuthorize{ policyFile = tpm2-pcr-public-key.pem, key = <this key> }
#     PolicyPCR{ pcrs = 7 }
#
# where the first element accepts any PCR 11 for which this key's signature is
# present in the booted UKI's .pcrsig section. See
# /usr/lib/systemd/system/systemd-repart.service.d/10-device.conf for the long
# version, and t9-pcr11-enroll for the positive test.
#
# MUST stay a separate key from SecureBootKey=. Two independent reasons, and the
# second is the one that bites:
#
#   1. The PCR signing key is what an update has to be able to re-sign with. It
#      is not the authority that says "this is a vngrd image"; it is the
#      authority that says "this particular UKI, with this initrd, is one I
#      authorised to unseal the root". Reusing the Secure Boot key would make
#      the PCR signature an artefact of the same key whose compromise this whole
#      scheme is not trying to bound -- and it would mean a leaked Secure Boot
#      key silently also unseals every root, with no second factor to notice.
#   2. It is a *different kind* of key. tpm2_calculate_policy_authorize()
#      hardcodes TPM2_ALG_RSASSA with TPM2_ALG_SHA256
#      (src/shared/tpm2-util.c:4160-4166) and rejects any signature buffer that
#      is not an RSA public-key size, so the PCR key cannot be an Ed25519 or
#      P-256 key the way sbsigntool's default would be. An EC key fails at
#      unseal with "Failed to validate signature in TPM", which on a machine
#      with no passphrase and no recovery passphrase yet is a brick on a disk that has
#      never worked. RSA is not a preference here; it is the only thing that
#      works.
#
# Paths: these two are machine-specific and normally belong in the gitignored
# mkosi.conf.d/50-local-keys.conf, which mkosi reads *after* this file and which
# therefore overrides whatever is written here. They are given here anyway, with
# the build machine's real paths, because a build that cannot sign PCR 11 must
# not silently produce a UKI whose .pcrsig is missing -- that is the
# PolicyAuthorize downgrade this whole block exists to prevent, reintroduced
# through a different door. scripts/check-inputs.sh resolves the effective
# setting the same way mkosi does and fails the build if the files are missing
# or empty.
#
# The .pcrsig and .pcrpkey are UKI *sections*, not files: there is nothing to
# copy anywhere and nothing on the ESP to keep in sync. systemd-stub packs
# .pcrpkey into the initrd cpio as /.extra/tpm2-pcr-public-key.pem
# (src/boot/stub.c:900) and .pcrsig as /.extra/tpm2-pcr-signature.json (:894),
# so the unseal path finds the signature with no configuration at all
# (tpm2_load_pcr_signature(NULL) adds /.extra to its search path when
# in_initrd(), src/shared/tpm2-util.c:8152-8156) and repart is pointed at the
# public key by absolute path from 10-device.conf.
#
# `yes' rather than the default: `auto' would enable this only when
# systemd-measure happens to be in the tools tree AND both of the settings below
# are non-empty, i.e. a missing tool or a typo in a path downgrades the seal to
# the bare PolicyPCR{7} without an error. An image whose root seal silently
# degraded is worse than an image that refuses to build.
#
# NOT THE SAME AS THE ROOT BEING BOUND TO AN IMAGE -- but it is now, jointly
# with repart. These three settings put a PCR 11 signature in the UKI; on their
# own they make no policy require it. That needs repart to be given
# --tpm2-public-key=/.extra/tpm2-pcr-public-key.pem --tpm2-public-key-pcrs=11,
# and it is, in systemd-repart.service.d/10-device.conf. Together the seal is
# PolicyAuthorize{ PCR_SIGNING_PUBKEY } over PCR 11 plus PolicyPCR over PCR 7, so a
# legitimately signed vngrd image of any version and any A/B slot no longer
# opens this root: only a UKI whose .pcrsig carries a signature this key made
# for the PCR 11 value the machine actually has. Read that file's banner before
# changing any of this.
#
# WHICH PHASE IS SIGNED, and it is the one setting here that is not obvious.
# mkosi passes --pcr-private-key but never --phases, so ukify's phase group list
# is empty and systemd-measure signs EVERY known phase -- four cumulative
# entries, one of which is the PCR 11 value the machine reaches *after*
# systemd-pcrphase-initrd.service's leave-initrd ExecStop. PolicyAuthorize
# accepts any signed value PCR 11 currently holds, so the root volume key would
# stay releasable for the whole boot instead of the whole initrd, and every test
# that asks "does the TPM unseal?" would pass, because it always would.
# scripts/ukify sits in front of ukify (via [Build] ExtraSearchPaths=) and
# injects `--phases=enter-initrd'; mkosi.postoutput then refuses to publish a
# UKI whose .pcrsig is not exactly one entry for PCR 11. An update therefore
# needs a fresh .pcrsig signed with pcr.key at the new UKI's enter-initrd value,
# which is what scripts/ukify does automatically as part of every build.
SignExpectedPcr=yes
# Repo-relative paths into the gitignored keys/local/ directory: mkosi resolves
# settings relative to the configuration file, so this means "next to mkosi.conf,
# not committed". A fresh checkout fails here with recipe printed by
# lib/image.sh until gen-test-keys.sh (or a manual openssl) creates the pair.
# Real keys elsewhere override via mkosi.conf.d/50-local-keys.conf, which mkosi
# reads after this file. The paths must not default to anyone's $HOME.
SignExpectedPcrKey=keys/local/pcr.key
SignExpectedPcrCertificate=keys/local/pcr.crt

# mkosi writes <output>.SHA256SUMS before mkosi.postoutput runs, so it would
# cover the pre-rename, pre-compression filenames and then be overwritten by ours.
# Off; mkosi.postoutput writes the manifest that matches the published artifacts.
#
# NO Sign=, DELIBERATELY. Sign= is a [Validation] setting, not an [Output] one
# (mkosi config.py:3798-3804) -- a common misreading, and worth writing down
# because it looks like the obvious way to get a signed manifest for free. It does
# not work here, for two independent reasons, and the first one is the dangerous
# one:
#
#   1. calculate_signature() returns immediately unless Checksum= is also on
#      (mkosi __init__.py:2537-2539), so Sign=yes implies Checksum=yes. And
#      calculate_sha256sum() (__init__.py:2520-2534) hashes the *staging*
#      directory, i.e. the pre-rename, pre-compression
#      vngrd_<ver>.vngrd-<ver>-<uuid>.usr.raw names, before mkosi.postoutput has
#      published anything. A detached GPG signature over that file is a valid
#      signature over a manifest that does not describe the artifacts that ship.
#      That is strictly worse than an unsigned correct manifest: it makes the
#      wrong answer look authoritative, and a verifier that checks the signature
#      and then the hashes would report success.
#   2. calculate_signature_gpg() needs a GNUPGHOME that exists (__init__.py:
#      2557-2559 dies on "GPG home ... not found"), a gpg in the tools tree (it is
#      there -- gnupg ships in mkosi.tools), and a secret key. This project has
#      no OpenPGP key of any kind; mkosi.conf.d/50-local-keys.conf points at an
#      X.509 key and certificate for sbsign, which is a different format for a
#      different purpose, and check-inputs.sh does not look for one. Setting
#      Sign=yes today would fail every build on a missing GNUPGHOME.
#
# So the manifest is signed, when it is signed, by mkosi.postoutput -- over the
# finished file, after the rename and the compression, which is the only point at
# which the names in it are the names that ship. It is off by default and says so
# on every build; SIGN_SHA256SUMS=<key id> plus SIGN_GNUPGHOME=<dir> turns it on.
# The output is SHA256SUMS.gpg, the name and format that
# /usr/lib/sysupdate.d/50-usr.transfer already documents for the future url-file
# source. See the manifest block at the end of mkosi.postoutput.
Checksum=no

[Build]
ToolsTree=yes
ToolsTreeDistribution=arch
RepartOffline=yes
Incremental=no
CacheOnly=auto
# Put scripts/ ahead of the tools tree on the tool search path, so mkosi
# resolves `ukify' to scripts/ukify rather than mkosi.tools/usr/bin/ukify.
#
# The wrapper is a security requirement, not a convenience. mkosi never passes
# --phases to ukify, so the real ukify signs every known boot phase, and one of
# those entries is the PCR 11 value that the machine reaches *after*
# systemd-pcrphase-initrd.service's leave-initrd ExecStop. The volume key would
# then stay releasable for the whole boot instead of the whole initrd. Read the
# header of scripts/ukify before changing this.
ExtraSearchPaths=scripts
