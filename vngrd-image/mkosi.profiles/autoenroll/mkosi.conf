[Validation]
# Disposable test/development profile only.
#
# This puts mkosi's generated PK/KEK/db.auth on the ESP so a fresh VM in setup
# mode enrols itself on first boot. On bare metal that is the window this
# project closes by default: anything that can write the ESP before first boot
# can enrol its own platform key. Never publish an image built with this
# profile, and never use it on hardware whose firmware you do not own.
#
# The test harness does not need it: run-vm.sh pre-enrols a fresh OVMF variable
# store host-side, which is the closer model of a production machine.
SecureBootAutoEnroll=yes
