# Customizations for mkosi's built-in default-initrd generator (MakeInitrd=yes).
#
# For normal distributions mkosi populates the initrd by installing systemd/udev
# from distro repos. Distribution=custom has no package source, so the initrd's
# contents come from lib/initrd.sh (the build_initrd stage) instead, which assembles exactly what
# the boot chain needs out of ../output/rootfs. mkosi still does all the initrd
# assembly itself: /init, units, UKI, compression.
#
# Parsed before the builtin mkosi-initrd config; the builtin then layers
# Output=initrd/Format=cpio, MakeInitrd=yes, RemoveFiles=, KernelModules= on top.

[Content]
# SkeletonTrees, NOT BaseTrees. This used to be
#
#     BaseTrees=../output/rootfs
#
# which is a 273 MB mistake. BaseTrees= copies a whole tree to "/" with no
# subpath selection and no target=, and this rootfs *is* /usr — it is a hermetic
# merged-/usr distro — so all of it landed in the initrd: 17,904 entries, 237 MB
# unpacked, 64 MB zstd, 80% of the UKI. It was also the only thing populating
# the initrd at all, because for Distribution=custom the package manager's
# install() is literally `pass`, so mkosi's builtin Packages=systemd udev bash
# less gzip puts nothing in. Dropping BaseTrees= without a replacement fails the
# build with "usr/lib/os-release not found".
#
# It was not only size. A complete unverified /usr inside the initrd means that
# if the dm-verity mount ever fails, PID 1 — which refuses only when /usr is
# *empty* (main.c:2438) — silently continues on that copy. The initrd's /usr was
# the fallback that made a verity failure invisible. There is now nothing to fall
# back to. See lib/initrd.sh and the seed lists under initrd/.
SkeletonTrees=../output/initrd-root
