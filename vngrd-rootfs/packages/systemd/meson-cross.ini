[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '/out'
pkg_config_libdir = '/out/usr/lib/pkgconfig:/out/usr/share/pkgconfig'

# -L/usr/lib/x86_64-linux-gnu is not redundant with -L/out/usr/lib. The host's
# /usr/lib/gcc/<triple>/12/libgcc_s.so is a linker script whose body is
# GROUP ( libgcc_s.so.1 -lgcc ), and the real .so.1 is in the multiarch
# directory. With --sysroot=/out, lld also searches /out/usr/lib -- where
# glibc lives, but not libgcc_s.so.1 -- so any link that pulls in the
# unwinder dies with 'unable to find libgcc_s.so.1'. libpam's pam_pwhistory
# hit it, via this file. /out/usr/lib stays first so the cross libc still
# wins over the host's.
[built-in options]
c_args = ['-O2', '-pipe', '-march=x86-64', '--sysroot=/out', '-Wno-error=incompatible-pointer-types-discards-qualifiers', '-Wno-error=initializer-overrides', '-Wno-error=override-init']
cpp_args = ['-O2', '-pipe', '-march=x86-64', '--sysroot=/out', '-Wno-error=incompatible-pointer-types-discards-qualifiers', '-Wno-error=initializer-overrides', '-Wno-error=override-init']
c_link_args = ['-Wl,-O1', '-Wl,--as-needed', '-fuse-ld=lld', '--sysroot=/out', '-L/out/usr/lib', '-L/usr/lib/x86_64-linux-gnu', '-Wl,--dynamic-linker=/usr/lib/ld-linux-x86-64.so.2']
cpp_link_args = ['-Wl,-O1', '-Wl,--as-needed', '-fuse-ld=lld', '--sysroot=/out', '-L/out/usr/lib', '-L/usr/lib/x86_64-linux-gnu', '-Wl,--dynamic-linker=/usr/lib/ld-linux-x86-64.so.2']
