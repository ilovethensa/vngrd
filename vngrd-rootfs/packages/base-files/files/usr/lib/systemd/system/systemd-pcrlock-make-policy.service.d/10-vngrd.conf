# The pcrlock refresh. It re-locks the components the lock-* units write into
# /var/lib/pcrlock.d, recomputes the prediction, and writes the TPM NV index the
# root token is bound to through PolicyAuthorizeNV. It also rewrites
# /var/lib/systemd/pcrlock.json and the ESP copy the next initrd reads.
#
# The unit stays enabled so a firmware update (PCRs 0-3, 5, 7, 13, 14) can move
# the policy from the host without cryptenroll or unlocking the volume. A change
# to a PCR the old policy pins (dbx, key rotation) still needs the recovery
# passphrase or an explicit unlock-* first.
#
# Both phases use --location=850-sysinit and neither binds PCR 15. An earlier
# enrollment used upstream's default 760-:940-, which covered only PCR 15 in the
# initrd; the host's pcrmachine.service then measured PCR 15 and the NV write
# could never satisfy the old session (TPM2_RC_PCR_CHANGED).

[Service]
# The host must compute the same prediction the initrd enrollment did. The
# enrollment read /var/lib/pcrlock.d (initrd tmpfs) plus the shipped
# /usr/lib/pcrlock.d; here --components names this side's paths. A host policy
# built from a different tree changes shape and strands the next boot.
#
# What is not auto-healed: a dbx update or two live db certificates move a pinned
# PCR and require recovery or an unlock before the change.
#
# --location=770 means start=end="770", skipping the nvpcr-separator records and
# dropping PCR 9 from the policy. Both phases must use the same window.
#
# ExecStart= is cleared first: the package's own line would otherwise remain and
# the drop-in would append.
ExecStart=
# --components= is the measured fix: the lock-* definitions live in the initrd's
# tmpfs /var, which the next initrd does not have, so pin the search path to the
# shipped tree. Then normal outcome is "Prediction is identical ... skipping".
ExecStart=/usr/lib/systemd/systemd-pcrlock --components=/var/lib/pcrlock.d --components=/usr/lib/pcrlock.d --pcr=7,13,14 --location=850-sysinit make-policy

[Unit]
# Measure before predicting. pcrmachine.service also runs before sysinit.target
# with no ordering; if this unit ran first, PCR 15 would be unmeasured and the
# policy would bind it to zero. On the next host boot PCR 15 is measured, the
# shape changes, and the NV write must satisfy the old zero-pinning policy:
# TPM2_RC_PCR_CHANGED forever. With the measurement first, PCR 15 is unmapped in
# every host run, one shape for life. The enrollment drops PCR 15 for the
# complementary reason (defined component, absent from the initrd log).
After=systemd-pcrmachine.service
