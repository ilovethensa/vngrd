[Service]
# systemd's own "recompute after a completed update" unit, with vngrd's location
# window. An update moves PCR 4, 11 and 12 -- none of which the vngrd policy
# binds, because the stub's measurements into them have no pcrlock component --
# and it rewrites files on the ESP, which does not move PCR 5 either. So this run
# normally finds "Prediction is identical to current policy, skipping update.",
# and when it does not, the window it recomputes with has to be the same one the
# enrollment used. 770- would silently drop PCR 9; see
# systemd-pcrlock-make-policy.service.d/10-vngrd.conf.
#
# ExecStart= cleared first: the unit's own line comes from the systemd package and
# a drop-in appends rather than replaces.
ExecStart=
ExecStart=/usr/lib/systemd/systemd-pcrlock --components=/var/lib/pcrlock.d --components=/usr/lib/pcrlock.d --pcr=7,13,14 --location=850-sysinit
