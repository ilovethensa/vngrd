# Bound the LUKS2 root unlock so a failed TPM unseal cannot hang the boot forever.
# A changed PCR 7 or an unavailable key leaves cryptsetup without a usable key;
# the passphrase keyslot vngrd-provision adds is a fallback, not a repair.
#
# JobRunningTimeoutSec fails the job even when cryptsetup blocks inside the TPM
# and does not exit. Both timeouts are 600s: TCG/swtpm round trips can exceed a
# KVM-tuned 90s, and the image cannot know the host's speed. A drop-in on a
# generator-written unit is read: drop-ins are looked up by unit name.
#
# Whether the timeout actually fires is unverified (t6a/t6b hang either way), so
# do not claim this fixes the hang.
[Unit]
JobRunningTimeoutSec=600s

[Service]
# Make the refusal legible: the initrd journal is volatile and the serial-only
# test harness would otherwise see only the exit status.
StandardOutput=journal+console
StandardError=journal+console

TimeoutStartSec=600s

# 600s, not 90s: an unseal is several TPM round trips, each tens of seconds under
# TCG/swtpm (QEMU 11.1.1 tpm_emulator_unix_tx_bufs never signals the reply). A
# healthy first boot under TCG reached fixate at 63s; a 90s job timeout killed it
# as if it had failed. The image cannot know its host's speed, but an unbounded
# wait is the original hang this drop-in exists for.
