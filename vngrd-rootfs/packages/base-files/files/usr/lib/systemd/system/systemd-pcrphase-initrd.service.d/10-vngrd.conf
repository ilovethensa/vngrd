[Unit]
# Reset the leave-initrd extend from ExecStop. On switch-root the unit is stopped
# (Conflicts=initrd-switch-root.target) with no ordering against
# vngrd-provision.service, so leave-initrd can extend PCR 11 while cryptenroll
# still holds a PolicyPCR{11} session: TPM2_RC_PCR_CHANGED and the recovery
# passphrase never enrolled.
#
# Ordering cannot express "stop after that start"; the work lives in
# vngrd-leave-initrd.service instead. Only ExecStop is reset: an empty ExecStart=
# would clear the vendor enter-initrd measurement too.

[Service]
# ExecStop= must be in [Service]; in [Unit] it is silently ignored, leaving the
# vendor value in force. base-files/build asserts the section.
ExecStop=
