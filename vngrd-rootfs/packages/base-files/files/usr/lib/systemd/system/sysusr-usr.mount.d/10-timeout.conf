# Bound the /usr mount: without fstab, an unavailable verity device leaves
# sysusr-usr.mount activating forever, so initrd-usr-fs.target never fails and its
# OnFailure=emergency.target never fires (black screen, no console output).
#
# JobRunningTimeoutSec bounds the whole job; TimeoutStartSec only applies once the
# unit is running. 600s because a healthy TCG/swtpm unlock exceeded 90s (the
# emulator defect documented in run-vm.sh), and the image cannot know its host's
# speed. With this, the target fails and prints an error; the initrd has no
# usable shell, but the failure is reportable.
[Unit]
JobRunningTimeoutSec=600s

# 600s, not a KVM-tuned 90s: see systemd-cryptsetup@.service.d/10-timeout.conf.
# A 90s timeout killed a healthy TCG unlock and looked like a real failure.
