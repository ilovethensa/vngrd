# /etc population for vngrd. READ THE ONE RULE BEFORE ADDING A LINE.
#
# /etc is a tmpfs mounted by the initrd over /sysroot/etc before switch_root and
# carried through pivot_root; it is empty every boot and everything in it comes
# from the lines below.
#
# THE RULE: lines targeting /etc may only be C (copy from /usr/share/factory/etc,
# inside the verified /usr) or L (symlink into /var or /run). Never f, F or w, and
# never C+ or L+ except the documented /etc/os-release case.
#
#   - f/F/w would create a writable regular file that survives the boot, which is
#     the persistence class this design removes, and would expose tmpfiles'
#     symlink-following behaviour.
#   - C+ is not a stronger C: it swaps COPY_MERGE_EMPTY for COPY_MERGE, adding
#     missing files but never overwriting. On a fresh tmpfs plain C already copies
#     every boot because the destination is always empty, so there is no staleness
#     to solve.

# Vendor /etc content lives under /usr/share/factory/etc so dm-verity covers it.
C /etc/crypttab     - - - - /usr/share/factory/etc/crypttab
C /etc/hostname     - - - - /usr/share/factory/etc/hostname
C /etc/nsswitch.conf - - - - /usr/share/factory/etc/nsswitch.conf
C /etc/shadow       - - - - /usr/share/factory/etc/shadow
C /etc/shells       - - - - /usr/share/factory/etc/shells

# Directory destination: plain C merges; L+ would remove the live PAM tree.
C /etc/pam.d        - - - - /usr/share/factory/etc/pam.d

# /etc is regenerated, so persistent state lives in /var, inside the LUKS volume.
L /etc/machine-id   - - - - /var/lib/machine-id

# Deliberately not created:
#   /etc/ssh         no openssh package, so the link would dangle.
#   /etc/resolv.conf no resolver is compiled in and nothing writes the target.
#   /etc/localtime   no timezone is set; if added, link into /var/lib/vngrd.
