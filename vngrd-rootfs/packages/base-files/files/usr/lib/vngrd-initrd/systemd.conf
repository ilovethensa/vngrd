# Initrd-only systemd configuration.
#
# TEMPORARY diagnostic, and the reason it exists is worth recording: a failure to
# unseal the root in the initrd is otherwise completely silent. systemd-cryptsetup
# does log it -- "Failed to unseal secret using TPM2", "No valid TPM2 token data
# found" -- but through systemd's logger, into the initrd's volatile journal, which
# is gone before anyone can log in and which nothing in the serial-only test
# harness can read. A unit's StandardOutput=journal+console does not help: that
# covers the process's own fd 1 and 2, not systemd's own logging.
#
# LogTarget= is a [Manager] setting, not a kernel command line option:
# systemd.log_target= and systemd.log_level= are simply not parsed from
# /proc/cmdline in v262 (only systemd.unit, dump_core, early_core_pattern and a
# handful of others are), and the rd. prefix only filters those. So they have to
# come from here, where systemd actually looks. The rd. variants were tried first
# and did nothing.
#
# console and debug are both wanted: the target gets the lines onto the serial
# console at all, and the level surfaces the log_debug() calls on the TPM path,
# which name the branch that was taken.
[Manager]
LogTarget=console
LogLevel=debug
