# The CA store ships in /usr (see the ca-certificates package) but every TLS
# client looks under /etc: curl's compiled-in default CAfile is
# /etc/ssl/certs/ca-certificates.crt, with /etc/ssl/certs as capath. /etc on a
# running system is the writable btrfs root, so the link has to be created at
# boot rather than shipped in the image.
#
# The trailing + is load-bearing. Plain L only creates the symlink "if it does not
# exist yet", so on a machine that ran a build without the + the stale file is
# still there and TLS keeps failing with exactly the same error. Verified with
# the shipped systemd-tmpfiles: for a *file* destination, plain L leaves an
# existing file alone, L+ unlinks it. (For a *directory* destination L+ would
# remove the directory and its contents, which is why the os-release rule needs
# the same care and /etc/pam.d deliberately does not have a +.)
L+ /etc/ssl/certs/ca-certificates.crt - - - - /usr/share/ca-certificates/mozilla.crt
# capath: the hashed-symlink directory form. Our store is a single bundle, so
# there is nothing to hash, but the directory must exist because curl and
# openssl probe it as a fallback and a missing directory is a hard error in some
# code paths.
d /etc/ssl/certs 0755 root root -
