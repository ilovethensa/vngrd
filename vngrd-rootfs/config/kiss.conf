SYSROOT="/out"
CC="clang"
CXX="clang++"
CFLAGS="-O2 -pipe -march=x86-64 --sysroot=$SYSROOT"
CXXFLAGS="$CFLAGS"
CPPFLAGS="--sysroot=$SYSROOT"
# rpath: configure test binaries must find sysroot libraries on the build host
# without LD_LIBRARY_PATH (which would mix glibcs). On the target /out is absent
# and the loader falls through to /usr/lib.
#
# -L/usr/lib/x86_64-linux-gnu is not redundant with -L/usr/lib: the host's
# libgcc_s.so is a linker script naming libgcc_s.so.1, which lives only in the
# multiarch directory, while $SYSROOT/usr/lib is searched first so the cross libc
# wins.
LDFLAGS="-Wl,-O1 -Wl,--as-needed -fuse-ld=lld --sysroot=$SYSROOT -L$SYSROOT/usr/lib -L/usr/lib/gcc/x86_64-pc-linux-gnu/16 -L/usr/lib/x86_64-linux-gnu -L/usr/lib -Wl,--dynamic-linker=/usr/lib/ld-linux-x86-64.so.2 -Wl,-rpath,/out/usr/lib"
MAKEFLAGS="-j$(nproc)"

PKG_CONFIG_SYSROOT_DIR="$SYSROOT"
PKG_CONFIG_LIBDIR="$SYSROOT/usr/lib/pkgconfig:$SYSROOT/usr/share/pkgconfig"
PKG_CONFIG_PATH=""

# The multiarch -L is needed for fish's Rust half, which links through CARGO,
# not cmake's linker flags, and whose panic=unwind needs libgcc_s.so.1. glibc
# stays shared: static linking would break the merged-/usr interpreter.
RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld -C link-arg=--sysroot=/out -C link-arg=-L/out/usr/lib -C link-arg=-L/usr/lib/x86_64-linux-gnu -C link-arg=-Wl,--dynamic-linker=/usr/lib/ld-linux-x86-64.so.2 -C link-arg=-Wl,-rpath,/out/usr/lib"
CARGO_BUILD_JOBS="$(nproc)"
CARGO_TERM_QUIET="true"

AR="llvm-ar"
RANLIB="llvm-ranlib"
NM="llvm-nm"
LD="ld.lld"
STRIP="llvm-strip"
OBJCOPY="llvm-objcopy"
OBJDUMP="llvm-objdump"
READELF="llvm-readelf"

HOST="x86_64-pc-linux-gnu"

KISS_KERNEL="7.2"

KISS_PREFIX="/usr"

# One core short of the machine, never zero; override JOBS= for a dedicated
# builder. build-pkg.sh sources this with set -a, and package scripts fall back to
# nproc if JOBS is unset.
JOBS=$(( $(nproc) - 1 ))
[ "$JOBS" -lt 1 ] && JOBS=1
export JOBS
